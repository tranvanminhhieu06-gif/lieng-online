# Cấu hình triển khai cho Render (Blueprint).
#
# Có file này thì trên Render chỉ cần chọn "New > Blueprint", trỏ vào repo,
# Render tự đọc và dựng đúng dịch vụ — khỏi điền tay từng ô.
#
# Sau khi dựng xong PHẢI điền tay hai biến bí mật đánh dấu `sync: false`
# ở phần Environment. Mật khẩu và chuỗi kết nối không bao giờ nằm trong file này.

services:
  - type: web
    name: lieng-online
    runtime: node
    # Singapore là vùng gần Việt Nam nhất — độ trễ thấp nhất cho game thời gian thực.
    region: singapore

    # Gói free: đủ để bạn bè chơi với nhau, nhưng NGỦ ĐÔNG sau 15 phút không ai
    # truy cập. Người đầu tiên vào sau đó phải chờ khoảng 50 giây cho server dậy.
    # Muốn không ngủ thì đổi thành `starter`.
    #
    # Dữ liệu người chơi KHÔNG nằm trên máy này mà nằm ở Postgres bên ngoài
    # (Neon), nên server ngủ hay deploy lại cũng không mất gì.
    plan: free

    buildCommand: npm ci
    startCommand: npm start

    # Render gọi đường dẫn này để biết dịch vụ đã sống chưa
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Múi giờ để tính ngày điểm danh
      - key: GAME_TZ
        value: Asia/Bangkok

      - key: NODE_ENV
        value: production

      # Chuỗi kết nối Postgres của Neon — điền tay trong bảng điều khiển Render.
      # Dạng: postgresql://user:mật_khẩu@ep-xxx.ap-southeast-1.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Mật khẩu trang quản lý — điền tay. Bỏ trống thì /admin tự trả về 404.
      - key: ADMIN_PASSWORD
        sync: false
